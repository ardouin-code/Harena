 return `<svg class='avs' viewBox='0 0 100 100' width='${s}' height='${s}' role='img' aria-label='Avatar'><defs><clipPath id='avc'><circle cx='50' cy='50' r='50'/></clipPath><clipPath id='avt'><path d='${tor}'/></clipPath></defs><circle cx='50' cy='50' r='50' fill='${a.b}'/><g clip-path='url(#avc)'>${decor}${back}<rect x='42' y='62' width='16' height='14' fill='${sk}'/>${outfit}${arm}<circle cx='22' cy='51' r='6' fill='${sk}'/><circle cx='78' cy='51' r='6' fill='${sk}'/><ellipse cx='50' cy='48' rx='27.4' ry='29.4' fill='${sk}'/>${front}<path d='${brows}' stroke='${hc}' stroke-width='${a.y===1?4.2:3.4}' fill='none' stroke-linecap='round'/><circle cx='33' cy='60' r='4.2' fill='#ff8aa0' opacity='.4'/><circle cx='67' cy='60' r='4.2' fill='#ff8aa0' opacity='.4'/>${frk}${eyes}<path d='M47.5 58Q50 61.5 52.5 58' stroke='#00000055' stroke-width='2.2' fill='none' stroke-linecap='round'/>${beard}${mouth}${acc}</g></svg>`};
function me(){
 $('#tag').textContent='Build your character. Unlock extras with XP.';
 const sw=(k,i,c)=>`<button class='pk sw${av[k]===i?' on':''}' data-k='${k}' data-v='${i}' style='background:${c}' aria-label='Option ${i+1}'></button>`;
 const tx=(k,i,l)=>`<button class='pk tx${av[k]===i?' on':''}' data-k='${k}' data-v='${i}'>${l}</button>`;
 const row=(t,h)=>`<h2 class='sec'>${t}</h2><div class='picks'>${h}</div>`;
 const T=(k,L)=>L.map((l,i)=>tx(k,i,l)).join(''),S=(k,C)=>C.map((c,i)=>sw(k,i,c)).join('');
 view.innerHTML=`<div class='studio'>${avHTML2(av,170)}<p class='wallet'>⚡ ${stars} XP</p></div>`+row('Skin',S('s',SK))+row('Hair style',T('h',HS))+row('Hair color',S('c',HC))+row('Eyebrows',T('y',['Soft','Bold','Raised']))+row('Eyes',T('e',['Big','Dots','Happy']))+row('Eye color',S('i',EC))+row('Facial hair',T('f',['None','Stubble','Mustache','Beard']))+row('Freckles',T('k',['None','Freckles']))+row('Smile',T('m',['Smile','Grin','Smirk']))+row('Outfit',T('o',['Tee','Hoodie','Marinière','Collar','Turtleneck','Jacket','Dress','Overalls','Tricolore']))+row('Outfit color',S('t',SH))+row('Extras',ACCS.map(c=>`<button class='pk tx${av.a===c[0]?' on':''}' data-k='a' data-v='${c[0]}'>${c[1]}${own.includes(c[0])?'':`<small>🔒 ${c[2]} XP</small>`}</button>`).join(''))+row('Background',BGS.map(c=>`<button class='pk sw${av.b===c?' on':''}' data-k='b' data-v='${c}' style='background:${c}' aria-label='Background'></button>`).join(''))+row('Pose',T('p',['None','Wave','Thumbs up']))+row('Pattern',T('d',['None','Dots','Stripes','Sparkles']))+`<p class='wallet' id='amsg'></p>`;
 view.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v,y=scrollY;
  if(k==='a'){if(!own.includes(v)){const c=ACCS.find(x=>x[0]===v);if(stars<c[2]){$('#amsg').textContent='You need '+(c[2]-stars)+' more XP for the '+c[1]+'.';return}stars-=c[2];own.push(v)}}else if(k!=='b')v=+v;
  av={...av,[k]:v};save();me();scrollTo(0,y)});
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const SAY={home:['Bonjour! I’m Coco. Ready to learn?','Let’s earn some XP together!','Pick a lesson and let’s go!','A little practice every day!'],ok:['Super!','Bravo!','Magnifique!','Très bien!','Excellent!'],no:['Oops! Next time.','Almost! Keep going.','No worries, you’ll get it!'],go:['Take your time!','You’ve got this!','Hmm, which one?'],done:['Lesson complete! Bravo!','Great work today!','Quel champion!']};
const mascot=(m,s)=>{const up=m==='cheer',sad=m==='sad',thk=m==='think',wl=up?-38:sad?28:12;
 const ey=sad?57:thk?49:54,ex=thk?43:48,ex2=thk?69:72;
 const eyes=up?`<path d='M37 56Q46 44 55 56M65 56Q74 44 83 56' stroke='#1b2550' stroke-width='4.5' fill='none' stroke-linecap='round'/>`:`<circle cx='46' cy='52' r='12' fill='#fff'/><circle cx='74' cy='52' r='12' fill='#fff'/><circle cx='${ex}' cy='${ey}' r='6' fill='#1b2550'/><circle cx='${ex2}' cy='${ey}' r='6' fill='#1b2550'/><circle cx='${ex+2}' cy='${ey-2}' r='2' fill='#fff'/><circle cx='${ex2+2}' cy='${ey-2}' r='2' fill='#fff'/>`;
 const brows=sad?`<path d='M35 40L56 34M85 40L64 34' stroke='#1b2550' stroke-width='3.4' stroke-linecap='round'/>`:thk?`<path d='M36 38Q46 34 56 38M64 31Q74 26 84 31' stroke='#1b2550' stroke-width='3.4' fill='none' stroke-linecap='round'/>`:`<path d='M36 38Q46 33 56 38M64 38Q74 33 84 38' stroke='#1b2550' stroke-width='3.4' fill='none' stroke-linecap='round'/>`;
 const beak=`<path d='M56 64h8l-4 5z' fill='#ff7f9d'/>`+(up?`<path d='M50 70Q60 86 70 70Z' fill='#7a2e2e'/><path d='M55 78Q60 74 65 78Q60 82 55 78Z' fill='#ff7a8a'/>`:sad?`<path d='M51 76Q60 68 69 76' stroke='#7a2e2e' stroke-width='2.6' fill='none' stroke-linecap='round'/>`:`<path d='M60 69Q54 76 49 70M60 69Q66 76 71 70' stroke='#7a2e2e' stroke-width='2.6' fill='none' stroke-linecap='round'/>`)+`<path d='M30 68L9 63M30 73L9 77M90 68L111 63M90 73L111 77' stroke='#8a5a2b' stroke-width='1.8' stroke-linecap='round'/>`;
 const extra=up?`<g fill='#ffd166'>`+[[14,24],[106,28],[10,64],[110,62]].map(p=>`<path transform='translate(${p[0]} ${p[1]})' d='M0-7Q1-1 7 0Q1 1 0 7Q-1 1-7 0Q-1-1 0-7Z'/>`).join('')+`</g>`:sad?`<path d='M36 66Q32 74 36 78Q40 74 36 66Z' fill='#7fd4ff'/>`:'';
 return `<svg class='mas' viewBox='0 0 120 124' width='${s}' height='${Math.round(s*1.03)}' role='img' aria-label='Coco the cat'><path d='M94 102Q116 100 111 70' stroke='#ff9f45' stroke-width='11' fill='none' stroke-linecap='round'/><ellipse cx='46' cy='114' rx='10' ry='5' fill='#fff3e0'/><ellipse cx='74' cy='114' rx='10' ry='5' fill='#fff3e0'/><path d='M22 42L28 6L54 28Z' fill='#ffa94d'/><path d='M98 42L92 6L66 28Z' fill='#ffa94d'/><path d='M30 32L32 16L45 27Z' fill='#ff9ebd'/><path d='M90 32L88 16L75 27Z' fill='#ff9ebd'/><ellipse cx='60' cy='66' rx='42' ry='44' fill='#ffa94d'/><ellipse cx='19' cy='72' rx='11' ry='21' fill='#ff9f45' transform='rotate(${wl} 19 72)'/><ellipse cx='101' cy='72' rx='11' ry='21' fill='#ff9f45' transform='rotate(${-wl} 101 72)'/><ellipse cx='60' cy='80' rx='28' ry='27' fill='#fff3e0'/><ellipse cx='60' cy='22' rx='25' ry='9' fill='#e5484d' transform='rotate(-8 60 22)'/><circle cx='56' cy='12' r='3.4' fill='#e5484d'/>${eyes}${brows}<circle cx='33' cy='66' r='5' fill='#ff8aa0' opacity='.5'/><circle cx='87' cy='66' r='5' fill='#ff8aa0' opacity='.5'/>${beak}${extra}</svg>`};
function coco(m,t,s){const e=$('#coco');if(e)e.innerHTML=mascot(m,s||84)+`<div class='bubble'>${t}</div>`}
const _home=home;home=function(){_home();coco('happy',rnd(SAY.home),88)};
const allTopics=()=>['adult','kid'].flatMap(m=>DATA[m].topics.map(t=>({...t,m})));
let boss=null;
const bossKey=t=>t.m+lvl+t.id+'boss';
const gameKey=t=>t.m+lvl+t.id+'game';
function confetti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='cf';c.setAttribute('aria-hidden','true');const cols=['#2a4bd7','#e5484d','#ffc800','#58cc02','#ff86d0','#1cb0f6','#ce82ff'];for(let i=0;i<60;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=Math.random()*.6+'s';p.style.animationDuration=2+Math.random()*1.6+'s';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--r',Math.random()*720+'deg');if(i%3===0)p.style.borderRadius='50%';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function voice(){
 boss=null;$('#tag').textContent='Choose how French sounds in the Listen exercises.';
 const draw=()=>{if(tab!=='voice')return;const vs=frVoices();
  view.innerHTML=`<div class="shop"><div class="item" style="flex-wrap:wrap"><span class="ic">🗣️</span><div class="tx">Voice<small>${vs.length?vs.length+' French voice'+(vs.length>1?'s':'')+' on this device':'No French voices found here, so your default voice is used.'}</small></div><select id="vsel" class="vsel" aria-label="Voice"><option value="">Default French voice</option>${vs.map(v=>`<option value="${esc(v.name)}"${v.name===voiceName?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div><div class="item"><span class="ic">⏩</span><div class="tx">Speed<small id="rv">${rateMul.toFixed(2)}×</small></div><input id="vrate" type="range" min="0.5" max="1.3" step="0.05" value="${rateMul}" aria-label="Speed"></div><button class="btn primary" id="vtest">🔊 Test voice</button></div>`;
  const sample='Bonjour! Comment ça va?';
  $('#vsel').onchange=e=>{voiceName=e.target.value;try{localStorage.setItem('ft_voice',voiceName)}catch(x){}speak(sample,1)};
  $('#vrate').oninput=e=>{rateMul=+e.target.value;$('#rv').textContent=rateMul.toFixed(2)+'×';try{localStorage.setItem('ft_rate',String(rateMul))}catch(x){}};
  $('#vrate').onchange=()=>speak(sample,1);
  $('#vtest').onclick=()=>speak(sample,1)};
 draw();
 try{speechSynthesis.onvoiceschanged=draw}catch(e){}
}
const lessonsDone=t=>KINDS.every(k=>done[t.m+lvl+t.id+k[0]]);
function bossFinal(){
 const t=boss.t,kid=t.m==='kid',P=words(t),list=[];while(list.length<10)list.push(...shuffle(P));list.length=10;
 let i=0,lives=3,lock=false,started=false;
 const end=win=>{let xp=0;if(win&&!done[boss.key]){done[boss.key]=true;xp=60;addStar(xp)}
  view.innerHTML=`<div class="end"><div class="emoji">${win?'🏆':'💔'}</div><h2>${win?'Boss defeated!':'The boss won this time'}</h2><p>${win?(xp?'Level complete! You earned ⚡ '+xp+' XP and the next level is unlocked.':'You beat the boss again!'):'Try again. You need to finish with at least 1 life left.'}</p><div class="bar" style="justify-content:center"><button class="btn primary" id="ba">${win?'Play again':'Try again'}</button><button class="btn" id="bb">Back to levels</button></div></div>`;
  coco(win?'cheer':'sad',win?'Level complete! Magnifique!':'Almost! Try again!',90);$('#ba').onclick=bossFinal;$('#bb').onclick=home};
 const step=()=>{
  if(!boss||(started&&!$('#qg')))return;started=true;
  if(lives<=0||i>=10)return end(lives>0);
  lock=false;const w=list[i],toEn=kid||Math.random()<.5,opts=shuffle(shuffle(P.filter(x=>x!==w)).slice(0,3).concat([w]));
  $('#tag').textContent='Boss challenge · question '+(i+1)+' of 10';
  view.innerHTML=`<div class="ltop"><button class="x" id="qg" aria-label="Quit">✕</button><div class="prog"><i style="width:${i*10}%"></i></div><span class="hearts">❤️ ${lives}</span></div><div class="q">${kid&&w[2]?`<span class="emoji">${w[2]}</span>`:''}${toEn?w[0]:w[1]} <button class="say" id="sq" aria-label="Hear it">🔊</button></div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-i="${k}">${toEn?o[1]:o[0]}</button>`).join('')}</div>`;
  $('#qg').onclick=home;$('#sq').onclick=()=>speak(w[0]);
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=opts[+b.dataset.i]===w;b.classList.add(ok?'ok':'no');if(!ok){lives--;view.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i]===w)x.classList.add('ok')})}speak(w[0]);i++;setTimeout(step,ok?700:1400)});
 };
 step();
}
const _ge=gameEnd;
gameEnd=function(t,xp,again){_ge(t,xp,again);if(!boss)return;
 const n=+((t.match(/(\d+)/)||[])[1]||0),ok=/Speed/.test(t)?n>=6:true,p=$('.end p');
 if(ok&&!done[boss.key]){done[boss.key]=true;addStar(20);p.textContent='Game won! You earned ⚡ '+(xp+20)+' XP. The boss challenge is unlocked.';coco('cheer','Now beat the boss!',90)}
 else if(!ok)p.textContent='Not quite! Get 6 correct to beat this level. Try again!';
 const gb=$('#gb');if(gb){gb.textContent='Back to levels';gb.onclick=home}};
function home(){
 boss=null;topic=null;document.body.dataset.lvl=lvl;$('#tag').textContent='Finish the lessons, win the game, then beat the boss for big XP.';
 const T=allTopics();
 view.innerHTML=T.map((t,i)=>{const[c,s]=UC[i%6],open=i===0||!!done[bossKey(T[i-1])],ld=lessonsDone(t),bd=!!done[bossKey(t)],gd=!!done[gameKey(t)];
  const nodes=KINDS.map(k=>`<div class='step'><button class='node${done[t.m+lvl+t.id+k[0]]?' done':''}' data-i='${i}' data-k='${k[0]}' aria-label='${t.name}: ${k[2]}' ${open?'':'disabled'}>${k[1]}</button><small>${k[2]}</small></div>`).join('')+`<div class='step'><button class='node${gd?' done':''}' data-i='${i}' data-k='game' aria-label='${t.name}: level game' ${open&&ld?'':'disabled'}>🎮</button><small>Game</small></div><div class='step'><button class='node boss${bd?' done':''}' data-i='${i}' data-k='boss' aria-label='${t.name}: boss challenge' ${open&&gd?'':'disabled'}>🏆</button><small>Boss challenge</small></div>`;
  return `${i%3===0?`<div class='sect'><span>Section ${i/3+1}</span><small>Levels ${i+1}–${Math.min(i+3,T.length)}</small></div>`:''}<section class='unit${open?'':' locked'}' style='--uc:${c};--us:${s}'><div class='banner'><div><small>Level ${i+1}${bd?' · Complete':''}</small><h2>${t.fr}</h2><span>${open?t.name:'Locked · win the boss game in Level '+i}</span></div><span class='ico'>${t.icon}</span></div><div class='path'>${nodes}</div></section>`}).join('');
 view.querySelectorAll('.node').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,t=T[i];mode=t.m;const uc=UC[i%6];document.body.style.setProperty('--uc',uc[0]);document.body.style.setProperty('--us',uc[1]);const k=b.dataset.k;
  if(k==='game'){boss={t,key:gameKey(t)};coco('think','Win this game to unlock the boss!',80);[memory,speed][i%2]();return}
  if(k==='boss'){boss={t,key:bossKey(t)};coco('think','Final boss challenge! You have 3 lives.',80);bossFinal();return}
  topic={...t};topic.words=words(topic);topic.lvl=lvl;idx=0;flipped=false;if(k==='cards'){done[t.m+lvl+t.id+'cards']=true;save();learn()}else startQuiz(k)});
}
view.addEventListener('click',e=>{if(e.target.closest('#skip')&&quiz&&!quiz.locked&&skips>0){skips--;save();quiz.i++;(quiz.i<quiz.list.length&&quiz.hearts>0)?ask():finish()}});
view.addEventListener('click',e=>{const b=e.target.closest('#l1,#l2');if(b&&!topic){lvl=b.id==='l1'?1:2;home()}});
setMode('kid');paint();
$('#cvcoco').innerHTML=mascot('cheer',130);
$('#cvgo').onclick=()=>{const c=$('#cover');c.classList.add('gone');setTimeout(()=>c.remove(),400);speak('Bonjour!',1)};
try{$('#cvgo').focus()}catch(e){}
</script>
